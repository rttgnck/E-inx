name: CI
'on':
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          # Full history: the formatting check compares with the PR base and looks at merged upstream commits.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Install clang-format-21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      # Medium and high only; style notes (low) are advisory. Suppressions are in platformio.ini.
      - name: Run cppcheck
        run: pio check --fail-on-defect medium --fail-on-defect high

      # Only the lines this change touches, and not code merged unchanged from upstream Inx, so upstream's
      # files are never reformatted (that would make every later upstream merge conflict on whitespace).
      - name: Run clang-format
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          export PATH="/usr/lib/llvm-21/bin:$PATH"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=$(git rev-parse HEAD~1); fi
          python3 scripts/check_format_changed.py "$(git merge-base "$BASE" HEAD)"

      - name: Build Inx
        run: pio run
