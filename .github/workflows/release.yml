name: Compile Release
permissions:
  contents: write

on:
  push:
    tags:
      - '*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build Inx
        run: pio run -e gh_release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Inx-${{ github.ref_name }}
          path: |
            .pio/build/gh_release/bootloader.bin
            .pio/build/gh_release/firmware.bin
            .pio/build/gh_release/firmware.elf
            .pio/build/gh_release/firmware.map
            .pio/build/gh_release/partitions.bin

      - name: Publish GitHub Release for OTA
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # firmware.bin only. Every extra asset adds roughly 1.5 KB of uploader metadata to the
          # release JSON, and the on-device updater has to buffer that whole document in one
          # contiguous allocation with WiFi up — six assets took it from ~10 KB to 16.7 KB and the
          # update check started failing. bootloader.bin and partitions.bin are only needed to
          # flash a blank device with esptool; they stay in the build artifact above, which the
          # updater never reads.
          files: |
            .pio/build/gh_release/firmware.bin
